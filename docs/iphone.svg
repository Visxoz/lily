<svg xmlns="http://www.w3.org/2000/svg" width="360" height="76" viewBox="0 0 360 76">
  <title>Lily for iPhone</title>
  <style>
    text { font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, Inter, 'Helvetica Neue', Arial, sans-serif; }
  </style>
  <rect x="0.5" y="0.5" width="359" height="75" rx="18" fill="#121216" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- Phone outline, in the accent -->
  <g fill="none" stroke="#d65db1" stroke-width="2.5" transform="translate(30 21)">
    <rect x="0" y="0" width="20" height="34" rx="4.5"/>
  </g>
  <rect x="36" y="25" width="8" height="2.5" rx="1.25" fill="#d65db1"/>

  <text x="72" y="36" font-size="20" font-weight="700" fill="#f4f4f5">Lily for iPhone</text>
  <text x="72" y="57" font-size="14" fill="#a1a1aa">iOS 26 and later · free</text>

  <!-- Arrow out -->
  <g fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(318 27)">
    <path d="M2 18 L16 4 M6 3 H17 V14"/>
  </g>
</svg>
