<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190">
  <title>34 MB, one exe, 0.1% CPU while a song plays, 0 MB of GPU memory once minimised, and 256 kbps Opus with YouTube Premium</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e1f3a"/><stop offset="1" stop-color="#120e16"/></linearGradient><linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472d0"/><stop offset="1" stop-color="#9b5cff"/></linearGradient><style>text { font-family: -apple-system, 'SF Pro Display', system-ui, 'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }</style></defs>
  <rect width="1280" height="190" rx="28" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="189" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(0 0)">
    <rect x="40" y="40" width="28" height="5" rx="2.5" fill="url(#ink)"/>
    <text x="40" y="116"><tspan font-size="54" font-weight="700" letter-spacing="-1" fill="#ffffff">34</tspan><tspan font-size="24" font-weight="600" fill="#98989d" dx="8">MB</tspan></text>
    <text x="40" y="152" font-size="17" fill="#98989d">one exe, nothing else to install</text>
  </g>
  <rect x="320" y="40" width="1" height="110" fill="#ffffff" fill-opacity="0.1"/>
  <g transform="translate(320 0)">
    <rect x="40" y="40" width="28" height="5" rx="2.5" fill="url(#ink)"/>
    <text x="40" y="116"><tspan font-size="54" font-weight="700" letter-spacing="-1" fill="#ffffff">0.1</tspan><tspan font-size="24" font-weight="600" fill="#98989d" dx="8">% CPU</tspan></text>
    <text x="40" y="152" font-size="17" fill="#98989d">while a song plays</text>
  </g>
  <rect x="640" y="40" width="1" height="110" fill="#ffffff" fill-opacity="0.1"/>
  <g transform="translate(640 0)">
    <rect x="40" y="40" width="28" height="5" rx="2.5" fill="url(#ink)"/>
    <text x="40" y="116"><tspan font-size="54" font-weight="700" letter-spacing="-1" fill="#ffffff">0</tspan><tspan font-size="24" font-weight="600" fill="#98989d" dx="8">MB GPU</tspan></text>
    <text x="40" y="152" font-size="17" fill="#98989d">once it's minimised</text>
  </g>
  <rect x="960" y="40" width="1" height="110" fill="#ffffff" fill-opacity="0.1"/>
  <g transform="translate(960 0)">
    <rect x="40" y="40" width="28" height="5" rx="2.5" fill="url(#ink)"/>
    <text x="40" y="116"><tspan font-size="54" font-weight="700" letter-spacing="-1" fill="#ffffff">256</tspan><tspan font-size="24" font-weight="600" fill="#98989d" dx="8">kbps</tspan></text>
    <text x="40" y="152" font-size="17" fill="#98989d">Opus, with YouTube Premium</text>
  </g>
</svg>
